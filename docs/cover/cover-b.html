<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cover B</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 1200px; overflow: hidden; }
  body { background: #0b1220; color: #f1f5f9; font-family: "Inter", Arial, sans-serif; position: relative; }
  .glow { position: absolute; width: 1100px; height: 700px; left: 250px; top: 420px; background: radial-gradient(closest-side, rgba(52, 211, 153, .16), transparent); }
  .wrap { position: absolute; inset: 70px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .tag { position: absolute; right: 0; top: 0; font-size: 22px; font-weight: 600; color: #94a3b8; border: 1px solid #1e293b; border-radius: 999px; padding: 8px 16px; }
  .tag b { color: #34d399; }
  h1 { margin: 40px 0 0; font-size: 100px; line-height: 1.0; letter-spacing: -0.04em; font-weight: 800; }
  h1 em { font-style: normal; color: #34d399; }
  .chips { margin-top: 30px; display: flex; gap: 14px; }
  .chip { font-size: 25px; font-weight: 700; padding: 10px 20px; border-radius: 999px; background: rgba(52, 211, 153, .12); color: #a7f3d0; border: 1px solid rgba(52, 211, 153, .35); }
  .browser { position: relative; margin-top: 40px; width: 1220px; flex: none; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(148, 163, 184, .25); background: #fff; }
  .bar { height: 40px; background: #1e293b; display: flex; align-items: center; gap: 9px; padding: 0 18px; }
  .bar span { width: 13px; height: 13px; border-radius: 50%; background: #475569; }
  .browser img { display: block; width: 100%; }
  .flow { margin-top: 30px; display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 700; color: #cbd5e1; }
  .flow .n { padding: 10px 20px; border-radius: 12px; border: 1px solid #334155; background: #111a2b; }
  .flow .n.mcp { border-color: #34d399; color: #34d399; }
  .flow .a { color: #64748b; }
</style></head>
<body>
<div class="glow"></div>
<div class="wrap">
  <span class="tag">Built with <b>Claude Code</b></span>
  <h1>Build Your App<br>With <em>Claude Code</em></h1>
  <div class="chips"><span class="chip">Read-only MCP connector</span><span class="chip">Audit log</span><span class="chip">Approved deploys</span></div>
  <div class="browser"><div class="bar"><span></span><span></span><span></span></div><img src="console.png" alt="Demo console answering which campaign had the best cost per conversion"></div>
  <div class="flow"><span class="n">App</span><span class="a">→</span><span class="n">Database</span><span class="a">→</span><span class="n mcp">Read-only MCP</span><span class="a">→</span><span class="n">Claude</span></div>
</div>
</body></html>
